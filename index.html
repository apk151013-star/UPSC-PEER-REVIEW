<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UPSC Peer Review</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#dcdde0;--ink:#111;--fade:#dcdde0;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2b2e;--ink:#f2f2f2;--fade:#2a2b2e}}
:root[data-theme="dark"]{--bg:#2a2b2e;--ink:#f2f2f2;--fade:#2a2b2e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Inter Tight","Helvetica Neue",Arial,sans-serif}
button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.red{--b:#e8332b;--f:#fff}.dark{--b:#1b1b1d;--f:#f4f4f4}.white{--b:#f6f6f4;--f:#111}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;transition:transform 1.1s cubic-bezier(.77,0,.18,1),filter 1.1s cubic-bezier(.77,0,.18,1)}
#stage::after{content:"";position:absolute;inset:auto 0 0;height:26%;background:linear-gradient(transparent,var(--fade));pointer-events:none;z-index:200}
#col{position:absolute;inset:0}
.brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:22px;font-weight:800;letter-spacing:-.04em;font-size:20px;z-index:10}
#add{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:120px;z-index:10;background:#111;color:#fff;border-radius:99px;padding:10px 18px;font-weight:500;display:none}
.hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:0;right:0;text-align:center;font-size:15px;font-weight:500;z-index:10;pointer-events:none}
#empty{position:fixed;inset:0;display:none;place-items:center;text-align:center;font-size:20px;font-weight:500;padding:30px}
.c{position:absolute;left:50%;top:50%;width:var(--w);aspect-ratio:16/10;margin:calc(var(--w)*-.31) 0 0 calc(var(--w)*-.5);container-type:inline-size;background:var(--b);color:var(--f);text-align:left;padding:0;border-radius:10px;box-shadow:0 26px 50px rgba(0,0,0,.24);backface-visibility:hidden;will-change:transform}
.c b{position:absolute;left:4.5cqw;top:4cqw;font-size:2.6cqw;font-weight:500}
.c .hh{position:absolute;left:4.5cqw;bottom:3.5cqw;right:4.5cqw}
.c .hh i{display:block;font-style:normal;font-weight:800;font-size:var(--fs);line-height:.92;letter-spacing:-.045em;overflow-wrap:anywhere}
.c .sd{position:absolute;right:4.5cqw;top:4cqw;width:30cqw;font-size:2cqw;line-height:1.5}
.c .sd u{display:block;text-decoration:none;border-top:1px solid currentColor;padding-top:.6cqw;margin-bottom:1.2cqw;opacity:.85}
.page{position:fixed;inset:0;z-index:50;background:var(--b);color:var(--f);overflow:auto;transition:clip-path 1.1s cubic-bezier(.77,0,.18,1)}
.back{position:fixed;top:env(safe-area-inset-top,0px);left:0;width:68px;height:56px;background:#fff;color:#000;border-radius:0 0 20px 0;font-size:28px;z-index:2}
.in{box-sizing:border-box;display:flex;flex-direction:column;gap:20px;padding:110px 6vw 8vw;max-width:980px}
.in h1{margin:0;font-weight:800;font-size:clamp(40px,10vw,130px);line-height:.92;letter-spacing:-.05em;overflow-wrap:anywhere}
.m{overflow:hidden;display:block;padding-bottom:.08em}
.m>span{display:block;transform:translateY(108%);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.on .m>span{transform:none;transition-delay:.05s}
.r{opacity:0;transform:translateY(30px);margin:0}
.on .r{opacity:1;transform:none;transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--d)*90ms + 250ms)}
.q{font-size:clamp(18px,2.2vw,26px);line-height:1.35;font-weight:500;white-space:pre-wrap;max-width:60ch}
.meta{display:flex;flex-wrap:wrap;gap:10px}.meta span{border:2px solid currentColor;border-radius:99px;padding:6px 14px;font-size:15px;font-weight:500}
h2{margin:18px 0 0;font-size:clamp(24px,3.5vw,38px);letter-spacing:-.03em}
.box{background:var(--card);color:#111;border-radius:14px;padding:18px;display:grid;gap:12px}
.box input,.box textarea{width:100%;box-sizing:border-box;border:1px solid #c9c9cc;border-radius:8px;padding:10px;background:#fff;color:#111}
.box label{font-size:14px;font-weight:500;display:grid;gap:5px}
.btn{background:#111;color:#fff;border-radius:99px;padding:11px 22px;font-weight:500;justify-self:start}
.btn.s{background:transparent;color:inherit;border:2px solid currentColor;padding:8px 16px;font-size:15px}
.sub{background:var(--card);color:#111;border-radius:14px;padding:16px;display:grid;gap:8px}
.sub .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800}.sub small{font-weight:500;opacity:.65}
.fl{display:flex;flex-wrap:wrap;gap:8px}
.msg{font-size:15px;min-height:1.2em}
.discuss{background:#fff;color:#111;border-radius:14px;padding:16px;display:grid;gap:12px;margin-top:14px}.reacts,.comment-actions{display:flex;gap:8px;flex-wrap:wrap}.react-btn,.tiny-btn{background:#f0f0f2;color:#111;border-radius:99px;padding:8px 12px;font-size:14px}.react-btn.active{background:#111;color:#fff}.comment{border-top:1px solid #e5e5e5;padding:12px 0;display:grid;gap:7px}.comment.reply{margin-left:22px;border-left:3px solid #ddd;padding-left:12px}.comment-form{display:grid;gap:8px}.comment-form textarea{box-sizing:border-box;width:100%;min-height:76px;border:1px solid #ccc;border-radius:8px;padding:10px}.admin-btn{background:#9f1d1d;color:#fff;border-radius:99px;padding:7px 11px;font-size:13px}
#rd{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.88);overflow:auto;display:none;padding:64px 12px 24px;box-sizing:border-box}
#rd .x{position:fixed;top:12px;right:12px;background:#fff;color:#111;border-radius:99px;padding:10px 18px;font-weight:500;z-index:2}
#rd .pg{max-width:960px;margin:0 auto;display:grid;gap:14px;color:#fff}
#rd img{width:100%;border-radius:8px;background:#fff}#rd iframe{width:100%;height:85vh;border:0;border-radius:8px;background:#fff}
#fm{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.55);display:none;place-items:center;padding:16px;overflow:auto}
#fm .box{width:min(520px,100%)}#fm h3{margin:0}
#au{position:fixed;inset:0;z-index:400;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}#au .box{width:min(400px,100%)}#au h3{margin:0;font-size:26px;letter-spacing:-.03em}
#so{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;z-index:10;background:transparent;color:inherit;border:2px solid currentColor;border-radius:99px;padding:8px 16px;font-weight:500;display:none}\n#re:disabled{opacity:.5;cursor:not-allowed}#signedStatus.verified{color:#16803c}#signedStatus.unverified{color:#b45309}
@media (prefers-reduced-motion:reduce){.page,#stage{transition-duration:.01s}.m>span,.r{transition:none!important}}
</style></head><body>
<div class="brand">UPSC Peer Review</div>
<div id="signedStatus" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:125px;z-index:10;font-size:13px;font-weight:500;display:none"></div>\n<button id="so">Sign out</button>
<button id="add">+ Post question</button>
<div id="stage"><div id="col"></div></div>
<div id="empty"><div>No questions yet.<br><small id="emsg">Connecting…</small></div></div>
<div class="hint">Scroll or drag, then click a stack</div>
<div id="au"><form class="box" id="auf"><h3>UPSC Peer Review</h3>
<label>Full name (for new accounts)<input name="name" maxlength="40"></label>
<label>Email<input name="email" type="email" required autocomplete="email"></label>
<label>Password<input name="pw" type="password" required minlength="8" autocomplete="current-password"></label>
<div class="fl"><button class="btn" id="si">Sign in</button><button type="button" class="btn s" id="su" style="color:#111">Create account</button></div>
<button type="button" id="fp" style="background:none;color:#111;text-decoration:underline;justify-self:start;padding:0">Forgot password?</button>
<button type="button" id="re" style="background:none;color:#111;text-decoration:underline;justify-self:start;padding:0">Resend confirmation email</button>
<div class="msg" id="vstatus" role="status" aria-live="polite" style="font-weight:500"></div>
<div class="msg" id="aum" role="status" aria-live="polite"></div>
<div style="border-top:1px solid #ddd;padding-top:12px;display:grid;gap:8px"><span style="font-size:13px;color:#555">Want to try the platform without an account?</span><button type="button" class="btn s" id="guestEntry" style="color:#111;justify-self:stretch">Continue as Guest</button></div></form></div>
<div id="rd"><button class="x">Close</button><div class="pg"></div></div>
<div id="fm"><form class="box" id="qf"><h3>Post a question</h3>
<label>Paper / label<input name="l" required maxlength="30" placeholder="GS Paper II"></label>
<label>Stack title<input name="title" required maxlength="40" placeholder="Federalism"></label>
<label>Question<textarea name="p" required rows="4" maxlength="1500"></textarea></label>
<label>Maximum marks<input name="m" type="number" min="1" step="0.5" value="15" required></label>
<label>Deadline<input name="dl" type="datetime-local"></label>
<label>Stack colour<select name="t"><option value="red">Red</option><option value="dark">Dark</option><option value="white">White</option></select></label>
<div class="fl"><button class="btn">Publish</button><button type="button" class="btn s" id="fc">Cancel</button></div></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const col=$("#col"),st=$("#stage"),RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
let me={id:null,name:""},admin=false,guestMode=false,stacks=[],subs=[],cs=[],n=0,openId=null,pg=null,busy=false,ox=0,oy=0;
let pos=0,tg=0,G=200,dn=false,ly=0,moved=0,idle;
const fmt=t=>t?new Date(t).toLocaleString([], {dateStyle:"medium",timeStyle:"short"}):"";
function rebuild(){
  n=stacks.length;col.innerHTML="";
  stacks.forEach(d=>{const e=document.createElement("button");const len=d.title.length;
    e.className="c "+d.t;e.style.setProperty("--fs",(len<=9?19:len<=16?10:6.5)+"cqw");e.setAttribute("aria-label","Open "+d.title);
    const cnt=subs.filter(s=>s.sid===d.id).length;
    e.innerHTML=`<b>${esc(d.l)}</b><div class="sd"><u>${esc(d.m)} marks</u><u>${d.dl?"Due "+esc(fmt(d.dl)):"No deadline"}</u><u>${cnt} answer${cnt==1?"":"s"}</u></div><div class="hh"><i>${esc(d.title)}</i></div>`;
    col.appendChild(e)});
  cs=[...col.children];$("#empty").style.display=n?"none":"grid";
  if(pg)renderSubs();
}
function lay(){
  if(!n)return;
  const w=Math.min(innerWidth*.8,520);G=Math.min(innerHeight*.28,w*.62);col.style.setProperty("--w",w+"px");
  cs.forEach((e,i)=>{const p=((i-pos)%n+n*1.5)%n-n/2,a=Math.abs(p);
    e.style.opacity=Math.max(0,Math.min(1,2.3-a));e.style.zIndex=100-Math.round(a*10);e.style.pointerEvents=a<1.5?"auto":"none";
    e.style.transform=`perspective(1400px) translate3d(${Math.sin(p*.8)*w*.14}px,${p*G}px,${-a*70}px) rotateZ(${p*-9}deg) rotateY(${p*-12}deg) rotateX(${p*5}deg)`});
}
(function tick(){pos+=(tg-pos)*(RM?1:.085);lay();requestAnimationFrame(tick)})();
const snap=()=>{clearTimeout(idle);idle=setTimeout(()=>tg=Math.round(tg),150)};
addEventListener("wheel",e=>{if(!openId){tg+=e.deltaY*.0032;snap()}},{passive:true});
addEventListener("keydown",e=>{
  if(e.key==="Escape"){if($("#rd").style.display==="block")closeRd();else if($("#fm").style.display==="grid")$("#fm").style.display="none";else hide();return}
  if(openId)return;
  if(/Arrow(Down|Right)/.test(e.key))tg=Math.round(tg)+1;if(/Arrow(Up|Left)/.test(e.key))tg=Math.round(tg)-1});
st.addEventListener("pointerdown",e=>{dn=true;ly=e.clientY;moved=0});
addEventListener("pointermove",e=>{if(!dn)return;const dy=e.clientY-ly;ly=e.clientY;moved+=Math.abs(dy);tg-=dy/G});
addEventListener("pointerup",e=>{if(!dn)return;dn=false;
  if(moved<6){const c=e.target.closest&&e.target.closest(".c");if(c)show(cs.indexOf(c),e.clientX,e.clientY);return}snap()});

function show(i,x,y){
  if(busy||openId||!stacks[i])return;busy=true;const d=stacks[i];openId=d.id;ox=x;oy=y;
  const p=pg=document.createElement("section");p.className="page "+d.t;
  p.innerHTML=`<button class="back" aria-label="Back">←</button><div class="in">
  <p class="r" style="--d:0">${esc(d.l)}</p><h1 class="m"><span>${esc(d.title)}</span></h1>
  <p class="r q" style="--d:2">${esc(d.p)}</p>
  <div class="r meta" style="--d:3"><span>${esc(d.m)} marks</span><span>${d.dl?"Due "+esc(fmt(d.dl)):"No deadline"}</span></div>
  <div class="r" style="--d:4;display:grid;gap:12px">
  <h2>Submit your answer</h2>
  <form class="box" id="af"><label>Post as<input name="who" maxlength="40" required placeholder="Your name or an alias"></label>
  ${guestMode?`<label>Email (optional; visible only to the site admin)<input name="guestEmail" type="email" maxlength="254" autocomplete="email" placeholder="you@example.com"></label>`:""}
  <label>Typed answer (optional)<textarea name="answer" rows="8" maxlength="10000" placeholder="Write your answer here…"></textarea></label>
  <label>Answer files (PDF or images, several pages allowed)<input name="f" type="file" multiple accept="application/pdf,image/jpeg,image/png,image/webp"></label>
  <label>Note (optional)<textarea name="note" rows="2" maxlength="600"></textarea></label>
  <button class="btn">Submit answer</button><div class="msg" id="am"></div></form>
  ${admin?`<button class="btn s" id="del" style="justify-self:start">Delete this question</button>`:""}
  <h2>Answers from others</h2><div id="subs" style="display:grid;gap:12px"></div></div></div>`;
  p.style.clipPath=`circle(0px at ${x}px ${y}px)`;document.body.append(p);p.offsetWidth;
  p.style.clipPath=`circle(150vmax at ${x}px ${y}px)`;
  st.style.transformOrigin=`${x}px ${y}px`;st.style.transform="scale(1.4)";st.style.filter="blur(8px)";
  p.querySelector(".back").onclick=hide;p.querySelector("[name=who]").value=me.name||"";
  p.querySelector("#af").onsubmit=ev=>{ev.preventDefault();send(ev.target,d)};
  const del=p.querySelector("#del");if(del)del.onclick=async()=>{if(del.dataset.s!=="1"){del.dataset.s="1";del.textContent="Click again to confirm";return}
    await sb.from("stacks").delete().eq("id",d.id);await loadAll();hide()};
  setTimeout(()=>p.classList.add("on"),480);setTimeout(()=>busy=false,1120);renderSubs();
}
function hide(){
  if(busy||!openId)return;busy=true;const p=pg;p.classList.remove("on");
  p.style.clipPath=`circle(0px at ${ox}px ${oy}px)`;st.style.transform="";st.style.filter="";
  setTimeout(()=>{p.remove();pg=null;openId=null;busy=false},1120);
}
function renderSubs(){
  const box=pg.querySelector("#subs"),d=stacks.find(s=>s.id===openId);if(!d){hide();return}
  const l=subs.filter(s=>s.sid===openId).sort((a,b)=>b.at-a.at);
  box.innerHTML=l.length?"":`<div style="opacity:.8">No answers yet. Be the first.</div>`;
  l.forEach(s=>{const e=document.createElement("div");e.className="sub";
    e.innerHTML=`<div class="h"><span>${esc(s.who)}</span><small>${esc(fmt(s.at))}${s.late?" · late":""}</small></div>${s.answer?`<div style="white-space:pre-wrap;line-height:1.5">${esc(s.answer)}</div>`:""}${s.note?`<div>${esc(s.note)}</div>`:""}${s.files[0]&&s.files[0].t!=="application/pdf"?`<img src="${esc(s.files[0].u)}" alt="" style="width:100%;max-height:220px;object-fit:cover;object-position:top;border-radius:8px">`:""}<div class="fl"><button class="btn">Read answer (${s.files.length} file${s.files.length==1?"":"s"})</button>${admin?'<button class="admin-btn" data-delete-sub="'+s.id+'">Delete submission</button>':''}</div>`;
    const adminDelete=e.querySelector('[data-delete-sub]');if(adminDelete)adminDelete.onclick=async ev=>{ev.stopPropagation();if(!confirm('Permanently delete this submission and its discussion?'))return;const {error}=await sb.from('submissions').delete().eq('id',s.id);if(error){alert(error.message);return;}await loadAll();};
    e.style.cursor="pointer";e.tabIndex=0;e.setAttribute("role","button");e.setAttribute("aria-label","Read answer by "+s.who);e.onclick=()=>openRd(s);e.onkeydown=ev=>{if(ev.key==="Enter")openRd(s)};box.appendChild(e)});
}
async function send(f,d){
  const m=pg.querySelector("#am"),files=[...f.f.files],who=f.who.value.trim(),answerText=f.answer.value.trim();
  if(!who){m.textContent="Enter your name before submitting.";f.who.focus();return}
  if(guestMode&&f.guestEmail&&f.guestEmail.value.trim()&&!f.guestEmail.checkValidity()){m.textContent="Enter a valid email address or leave it blank.";f.guestEmail.focus();return}
  if(!files.length&&!answerText){m.textContent="Write your answer or upload at least one PDF/image.";return}
  for(const x of files)if(!/^(application\/pdf|image\/(jpeg|png|webp))$/.test(x.type)||x.size>20*1048576){m.textContent=`“${x.name}” must be a PDF/JPG/PNG/WEBP under 20 MB.`;return}
  f.querySelector(".btn").disabled=true;
  try{
    const out=[],run=Date.now(),folder=guestMode?`guest/${crypto.randomUUID()}`:me.id;
    for(let i=0;i<files.length;i++){
      m.textContent=`Uploading ${i+1} of ${files.length}…`;
      const path=`${folder}/${d.id}/${run}_${i}_${files[i].name.replace(/[^\w.-]/g,"_")}`;
      const u=await sb.storage.from("answers").upload(path,files[i],{contentType:files[i].type});if(u.error)throw u.error;
      out.push({u:sb.storage.from("answers").getPublicUrl(path).data.publicUrl,t:files[i].type,n:files[i].name})
    }
    const now=Date.now(),payload={stack_id:d.id,user_id:me.id,who,answer_text:answerText,note:f.note.value.trim(),files:out,late:!!(d.dl&&now>new Date(d.dl).getTime()),created_at:new Date(now).toISOString()};
    let r,submissionId=null,contactSaved=true;
    if(guestMode){
      r=await sb.from("submissions").upsert(payload,{onConflict:"stack_id,user_id"}).select("id").single();
      if(r.error)throw r.error;
      submissionId=r.data.id;
      const contact=f.guestEmail?f.guestEmail.value.trim():"";
      if(contact){const cr=await sb.from("submission_contacts").upsert({submission_id:submissionId,email:contact},{onConflict:"submission_id"});if(cr.error){contactSaved=false;console.warn("Optional contact email was not saved",cr.error)}}
    }else{
      r=await sb.from("submissions").upsert(payload,{onConflict:"stack_id,user_id"});
      if(r.error)throw r.error;
    }
    await loadAll();
    m.textContent=guestMode?(contactSaved?"Your answer has been submitted as a guest. Thank you!":"Your answer was submitted, but your optional contact email could not be saved."):"Submitted. Submitting again replaces your earlier answer.";
    f.f.value="";if(f.guestEmail)f.guestEmail.value="";
  }catch(e){m.textContent="Upload failed: "+(e.message||"try again")}
  f.querySelector(".btn").disabled=false;
}
async function openRd(s){
  const r=$("#rd"),b=r.querySelector(".pg");
  b.innerHTML=`<div><b>${esc(s.who)}</b> · ${esc(fmt(s.at))}</div>${s.answer?`<div style="white-space:pre-wrap;line-height:1.6">${esc(s.answer)}</div>`:""}${s.note?`<div>${esc(s.note)}</div>`:""}`;
  s.files.forEach(f=>{const isPdf=f.t==="application/pdf",el=document.createElement(isPdf?"iframe":"img");el.src=f.u;if(!isPdf)el.alt=f.n;b.appendChild(el);
    const a=document.createElement("a");a.href=f.u;a.target="_blank";a.rel="noopener";a.style.color="#fff";a.textContent="Open "+f.n+" in a new tab";b.appendChild(a)});
  const discussion=document.createElement("section");discussion.className="discuss";discussion.id="discussion";b.appendChild(discussion);
  if(admin){const del=document.createElement("button");del.className="admin-btn";del.textContent="Delete this submission (admin)";del.onclick=async()=>{if(!confirm("Permanently delete this submission and its comments/reactions?"))return;const {error}=await sb.from("submissions").delete().eq("id",s.id);if(error){alert("Delete failed: "+error.message);return;}closeRd();await loadAll();};b.appendChild(del);}
  r.style.display="block";r.scrollTop=0;await renderDiscussion(s.id);
}
async function renderDiscussion(submissionId){
  const root=$("#discussion");if(!root)return;root.dataset.submission=submissionId;
  root.innerHTML='<h2 style="margin:0;font-size:26px">Reactions & discussion</h2><div id="reactionList" class="reacts"></div><h3 style="margin:8px 0 0">Comments</h3><div id="commentList"></div><form id="commentForm" class="comment-form"><div id="replyingTo" style="font-size:13px;color:#555"></div><input name="author" maxlength="40" required placeholder="Display name" value="${esc(me.name||"Guest")}" style="box-sizing:border-box;width:100%;border:1px solid #ccc;border-radius:8px;padding:10px"><textarea name="body" maxlength="2000" required placeholder="Share constructive feedback or ask a question..."></textarea><div class="fl"><button class="btn">Post comment</button><button type="button" class="tiny-btn" id="cancelReply" style="display:none">Cancel reply</button></div><div class="msg" id="commentMsg"></div></form>';
  const types=[['❤️','Helpful'],['👍','Good answer'],['💡','Insight'],['🔥','Excellent']];
  const [rr,cr]=await Promise.all([
    sb.from('submission_reactions').select('id,user_id,reaction').eq('submission_id',submissionId),
    sb.from('comments').select('*').eq('submission_id',submissionId).order('created_at')
  ]);
  if(rr.error||cr.error){root.querySelector('#commentMsg').textContent='Could not load discussion: '+(rr.error||cr.error).message;return;}
  const reactions=rr.data||[],comments=cr.data||[];
  const commentIds=comments.map(x=>x.id);
  let likes=[];if(commentIds.length){const lr=await sb.from('comment_likes').select('comment_id,user_id').in('comment_id',commentIds);if(lr.error){root.querySelector('#commentMsg').textContent='Could not load comment likes: '+lr.error.message;return;}likes=lr.data||[];}
  const reactionBox=root.querySelector('#reactionList');
  types.forEach(([emoji,label])=>{const count=reactions.filter(x=>x.reaction===label).length,active=reactions.some(x=>x.user_id===me.id&&x.reaction===label);const btn=document.createElement('button');btn.className='react-btn'+(active?' active':'');btn.textContent=`${emoji} ${label} · ${count}`;btn.onclick=async()=>{if(active){const {error}=await sb.from('submission_reactions').delete().eq('submission_id',submissionId).eq('user_id',me.id).eq('reaction',label);if(error)alert(error.message);}else{const {error}=await sb.from('submission_reactions').insert({submission_id:submissionId,user_id:me.id,reaction:label});if(error)alert(error.message);}await renderDiscussion(submissionId);};reactionBox.appendChild(btn);});
  const list=root.querySelector('#commentList');
  if(!comments.length)list.innerHTML='<p style="color:#666">No comments yet. Start a constructive discussion.</p>';
  comments.forEach(c=>{const liked=likes.some(x=>x.comment_id===c.id&&x.user_id===me.id),count=likes.filter(x=>x.comment_id===c.id).length,own=c.user_id===me.id,canManage=own||admin;const el=document.createElement('article');el.className='comment'+(c.parent_id?' reply':'');el.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(c.author_name)}</b><small>${esc(fmt(c.created_at))}</small></div><div style="white-space:pre-wrap;line-height:1.5">${esc(c.body)}</div><div class="comment-actions"><button class="tiny-btn" data-act="reply" data-id="${c.id}">Reply</button><button class="tiny-btn" data-act="like" data-id="${c.id}">${liked?'♥':'♡'} ${count}</button>${own?`<button class="tiny-btn" data-act="edit" data-id="${c.id}">Edit</button>`:''}${canManage?`<button class="tiny-btn" data-act="delete" data-id="${c.id}">${admin&&!own?'Admin delete':'Delete'}</button>`:''}</div>`;list.appendChild(el);});
  let parentId=null;const form=root.querySelector('#commentForm'),replyLabel=root.querySelector('#replyingTo'),cancel=root.querySelector('#cancelReply');
  list.onclick=async ev=>{const btn=ev.target.closest('button[data-act]');if(!btn)return;const c=comments.find(x=>x.id===btn.dataset.id);if(!c)return;const act=btn.dataset.act;
    if(act==='reply'){parentId=c.id;replyLabel.textContent='Replying to '+c.author_name;cancel.style.display='inline-block';form.body.focus();}
    if(act==='like'){const existing=likes.some(x=>x.comment_id===c.id&&x.user_id===me.id);const res=existing?await sb.from('comment_likes').delete().eq('comment_id',c.id).eq('user_id',me.id):await sb.from('comment_likes').insert({comment_id:c.id,user_id:me.id});if(res.error)alert(res.error.message);await renderDiscussion(submissionId);}
    if(act==='edit'){const next=prompt('Edit your comment:',c.body);if(next===null)return;if(!next.trim()||next.length>2000){alert('Comment must contain 1–2000 characters.');return;}const res=await sb.from('comments').update({body:next.trim(),updated_at:new Date().toISOString()}).eq('id',c.id);if(res.error)alert(res.error.message);await renderDiscussion(submissionId);}
    if(act==='delete'){if(!confirm('Delete this comment?'))return;const res=await sb.from('comments').delete().eq('id',c.id);if(res.error)alert(res.error.message);await renderDiscussion(submissionId);}
  };
  cancel.onclick=()=>{parentId=null;replyLabel.textContent='';cancel.style.display='none';};
  form.onsubmit=async ev=>{ev.preventDefault();const body=form.body.value.trim();if(!body)return;const author=form.author.value.trim().slice(0,40);if(!author){root.querySelector('#commentMsg').textContent='Enter a display name.';return;}const res=await sb.from('comments').insert({submission_id:submissionId,user_id:me.id,author_name:author,body,parent_id:parentId});if(res.error){root.querySelector('#commentMsg').textContent='Could not post comment: '+res.error.message;return;}await renderDiscussion(submissionId);};
}
function closeRd(){const r=$("#rd");r.style.display="none";r.querySelector(".pg").innerHTML=""}
$("#rd .x").onclick=closeRd;
$("#add").onclick=()=>$("#fm").style.display="grid";$("#fc").onclick=()=>$("#fm").style.display="none";

  const r=await sb.from("stacks").insert({label:f.l.value.trim(),title:f.title.value.trim(),body:f.p.value.trim(),max_marks:Number(f.m.value),deadline:f.dl.value?new Date(f.dl.value).toISOString():null,color:f.t.value});

const sb=supabase.createClient(CFG.url,CFG.key);
async function loadAll(){
  const [a,b]=await Promise.all([sb.from("stacks").select("*").order("created_at"),sb.from("submissions").select("*").order("created_at",{ascending:false})]);
  if(a.error||b.error)return;
  stacks=a.data.map(x=>({id:x.id,l:x.label,title:x.title,p:x.body,m:x.max_marks,dl:x.deadline||"",t:x.color,at:+new Date(x.created_at)}));
  subs=b.data.map(x=>({id:x.id,sid:x.stack_id,uid:x.user_id,who:x.who,answer:x.answer_text||"",note:x.note||"",files:x.files||[],at:+new Date(x.created_at),late:x.late}));
  rebuild();
}
async function enter(session){
  const au=$("#au"),signedStatus=$("#signedStatus");
  if(!session){
    guestMode=false;me={id:null,name:""};admin=false;
    au.style.display="grid";
    $("#so").style.display=$("#add").style.display="none";
    signedStatus.style.display="none";
    return;
  }
  au.style.display="none";
  const u=session.user;
  guestMode=!!u.is_anonymous;
  const verified=!!(u.email_confirmed_at||u.confirmed_at);
  me={id:u.id,name:(u.user_metadata&&u.user_metadata.full_name)||(guestMode?"Guest":"")};
  signedStatus.style.display="block";
  signedStatus.className=verified?"verified":"unverified";
  signedStatus.textContent=guestMode?"Guest session · comments enabled":(verified?"Email verified ✓":"Email not verified");
  const r=await sb.from("admins").select("user_id").eq("user_id",u.id);
  admin=!!(r.data&&r.data.length);
  $("#so").style.display="block";$("#add").style.display=admin?"block":"none";
  $("#emsg").textContent=admin?"Use “Post question” to create the first stack.":"No questions have been posted yet.";
  await loadAll();
}
const aum=$("#aum"),vstatus=$("#vstatus"),resendBtn=$("#re");
let resendSeconds=0,resendTimer=null,lastSignupEmail="";
function setAuthMessage(message){aum.textContent=message;}
function startResendCooldown(seconds=60){
  resendSeconds=seconds;
  resendBtn.disabled=true;
  if(resendTimer)clearInterval(resendTimer);
  const update=()=>{
    resendBtn.textContent=resendSeconds>0
      ?`Resend confirmation email (${resendSeconds}s)`
      :"Resend confirmation email";
    if(resendSeconds<=0){
      clearInterval(resendTimer);
      resendTimer=null;
      resendBtn.disabled=false;
    }else resendSeconds--;
  };
  update();
  resendTimer=setInterval(update,1000);
}
function showAuthLinkError(){
  const params=new URLSearchParams(location.search);
  const hash=new URLSearchParams(location.hash.replace(/^#/,""));
  const code=params.get("error_code")||hash.get("error_code")||"";
  const description=(params.get("error_description")||hash.get("error_description")||"").replace(/\+/g," ");
  if(code==="otp_expired"||/expired|invalid.*link|link.*invalid/i.test(description)){
    vstatus.textContent="This confirmation link has expired or is invalid. Enter your email and use “Resend confirmation email” to request a fresh link.";
    vstatus.style.color="#b45309";
    return true;
  }
  if(code||description){
    vstatus.textContent="Email confirmation could not be completed. Request a fresh confirmation email below.";
    vstatus.style.color="#b45309";
    return true;
  }
  return false;
}
showAuthLinkError();
$("#auf").onsubmit=async ev=>{
  ev.preventDefault();
  const f=ev.target,email=f.email.value.trim();
  aum.textContent="";
  vstatus.textContent="";
  const r=await sb.auth.signInWithPassword({email,password:f.pw.value});
  if(r.error){
    const msg=r.error.message||"";
    if(/email not confirmed/i.test(msg)){
      vstatus.textContent="Your email address is not verified yet. Check your inbox, or request a new confirmation email below.";
      vstatus.style.color="#b45309";
      lastSignupEmail=email;
      setAuthMessage("After entering your email, click “Resend confirmation email”.");
    }else if(/invalid login credentials/i.test(msg)){
      setAuthMessage("Email or password is incorrect. If you have not confirmed your email, request a new confirmation link.");
    }else setAuthMessage(msg);
  }
};
$("#su").onclick=async()=>{
  const f=$("#auf");
  if(!f.reportValidity())return;
  const email=f.email.value.trim();
  lastSignupEmail=email;
  setAuthMessage("Creating your account...");
  vstatus.textContent="";
  const r=await sb.auth.signUp({
    email,
    password:f.pw.value,
    options:{
      data:{full_name:f.name.value.trim()||"Aspirant"},
      emailRedirectTo:location.origin
    }
  });
  if(r.error){
    const msg=r.error.message||"";
    if(/already registered|already exists|user already|already been registered/i.test(msg)){
      vstatus.textContent="An account may already exist with this email. Try signing in. If it is not confirmed, use the resend button.";
      vstatus.style.color="#b45309";
      setAuthMessage("");
    }else setAuthMessage(msg);
    return;
  }
  if(r.data.session){
    vstatus.textContent="Your account is created and signed in.";
    vstatus.style.color="#16803c";
  }else{
    vstatus.textContent="Account created. Check your inbox and spam folder for the confirmation email. If it does not arrive, use the resend button below.";
    vstatus.style.color="#16803c";
    startResendCooldown(60);
  }
};
resendBtn.onclick=async()=>{
  const email=$("#auf").email.value.trim()||lastSignupEmail;
  if(!email){
    setAuthMessage("Enter the email address you used to register first.");
    $("#auf").email.focus();
    return;
  }
  if(!$("#auf").email.checkValidity()){
    setAuthMessage("Enter a valid email address.");
    $("#auf").email.focus();
    return;
  }
  if(resendSeconds>0)return;
  resendBtn.disabled=true;
  setAuthMessage("Requesting a new confirmation email...");
  vstatus.textContent="";
  try{
    const {error}=await sb.auth.resend({
      type:"signup",
      email,
      options:{emailRedirectTo:location.origin}
    });
    if(error){
      const msg=error.message||"";
      if(/already confirmed|already verified/i.test(msg)){
        vstatus.textContent="This email is already confirmed. You can sign in normally.";
        vstatus.style.color="#16803c";
        setAuthMessage("");
      }else if(/rate.?limit|too many requests|email rate limit/i.test(msg)){
        setAuthMessage("Too many email requests. Please wait before trying again, or try later.");
        startResendCooldown(60);
      }else if(/expired|invalid.*token/i.test(msg)){
        setAuthMessage("That confirmation link is no longer valid. Request a fresh confirmation email.");
        resendBtn.disabled=false;
      }else{
        setAuthMessage("Could not resend confirmation email: "+msg);
        resendBtn.disabled=false;
      }
    }else{
      vstatus.textContent="A new confirmation email has been requested. Check your inbox and spam folder.";
      vstatus.style.color="#16803c";
      setAuthMessage("If the email does not arrive, wait for the countdown before requesting another.");
      startResendCooldown(60);
    }
  }catch(err){
    setAuthMessage("Could not resend email: "+(err.message||"Please try again later."));
    resendBtn.disabled=false;
  }
};
$("#fp").onclick=async()=>{
  const e=$("#auf").email.value.trim();
  if(!e){setAuthMessage("Enter your email first.");return;}
  const r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin});
  setAuthMessage(r.error?r.error.message:"Password reset email requested. Check your inbox and spam folder.");
};
$("#guestEntry").onclick=async()=>{
  setAuthMessage("Starting a secure guest session...");
  const {data,error}=await sb.auth.signInAnonymously({options:{data:{full_name:"Guest"}}});
  if(error){setAuthMessage("Guest access could not start: "+error.message+". Ask the site owner to enable anonymous sign-ins in Supabase.");return;}
  if(data.session) await enter(data.session);
};
$("#so").onclick=()=>sb.auth.signOut();
sb.auth.onAuthStateChange((ev,session)=>{if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN"||ev==="SIGNED_OUT")setTimeout(()=>enter(session),0)});
setInterval(async()=>{if(me.id&&!dn){await loadAll();const opened=$("#rd").style.display==="block";const current=$("#discussion");if(opened&&current&&current.dataset.submission)await renderDiscussion(current.dataset.submission);}},20000);
